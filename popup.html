<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      height: 320px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    .status {
      font-size: 14px;
      margin-bottom: 10px;
    }
    
    .recording {
      color: red;
    }
    
    .stopped {
      color: green;
    }
    
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      min-width: 120px;
    }
    
    .start-btn {
      background-color: #4CAF50;
      color: white;
    }
    
    .stop-btn {
      background-color: #f44336;
      color: white;
    }
    
    .download-btn {
      background-color: #2196F3;
      color: white;
    }
    
    .screenshot-btn {
      background-color: #FF9800;
      color: white;
    }
    
    button:hover {
      opacity: 0.8;
    }
    
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    #downloadLink {
      display: none;
    }
    
    .settings {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      font-size: 12px;
    }
    
    .settings label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    
    .settings input {
      width: 100%;
      padding: 5px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 12px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Tab Screen Recorder</h2>
    <div id="status" class="status stopped">Ready to record</div>
    <button id="screenshotBtn" class="screenshot-btn">Take Screenshot</button>
    <button id="startBtn" class="start-btn">Start Recording</button>
    <button id="stopBtn" class="stop-btn" disabled>Stop Recording</button>
    <button id="downloadBtn" class="download-btn" disabled>Download Video</button>
    <a id="downloadLink"></a>
    
    <div class="settings">
      <label for="downloadDirectory">Screenshot Directory:</label>
      <input type="text" id="downloadDirectory" placeholder="Screenshots" value="Screenshots">
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
