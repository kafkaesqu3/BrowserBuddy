[project]
name = "browserbuddy"
version = "0.1.0"
description = "Local backend for BrowserBuddy: browsing memory ingest, search, and recall agent"
readme = "README.md"
authors = [{ name = "David Tulis" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.14.2",
    "typer>=0.26.8",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
semantic = ["sentence-transformers>=6.2.0", "sqlite-vec>=0.1.9"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[project.scripts]
buddy = "browserbuddy.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette 1.x warns to use httpx2; suppress until FastAPI bumps its dep.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
